[project]
name = "garmin-agent"
version = "0.1.0"
description = "Daily export of Garmin Connect health data to Google Drive, with a Telegram summary"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.15",
    "garth>=0.8.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
]
